[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liveblocks"
version = "0.0.1"
description = "序界（LiveBlocks）：实体卡片编程实验项目"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "llroxy-by" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Private :: Do Not Upload",
]
# 骨架阶段（LB-001）不引入运行时依赖；LB-002 起按需添加（例如 OpenCV）。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
liveblocks = "liveblocks.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
