[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liveblocks"
version = "0.0.1"
description = "序界（LiveBlocks）：实体卡片编程实验项目"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "llroxy-by" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Private :: Do Not Upload",
]
# 运行时依赖为零：LB-002 的合成卡片生成器只用标准库（自带 PNG 编码与 ArUco 位表），
# 这样「固定种子 → 字节一致」不依赖任何第三方库的渲染细节。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# 可选交叉核对：用 OpenCV 的 DICT_4X4_50 逐位校验入库位表、并确认合成图里的标记可被检出。
# 只用于测试核对（tests/test_synth_dictionary.py 在装不到 opencv 时自动跳过），不是运行时依赖。
aruco = ["opencv-python-headless>=4.8"]

[project.scripts]
liveblocks = "liveblocks.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"liveblocks.data" = ["*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
