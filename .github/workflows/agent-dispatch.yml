name: dispatch-agent

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  dispatch:
    if: github.event.issue.user.login == 'llroxy-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Comment to wake the agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "@llroxy-bot 请按本 Issue 的「范围」与「验收」执行，完成后开 PR 到 main，不要合并。"
