name: dispatch-agent

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to dispatch
        required: true

permissions:
  issues: write

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'llroxy-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the orchestrator poll window
        run: sleep 100
      - name: Comment the full work order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER="${{ github.event.issue.number || inputs.issue_number }}"
          gh issue view "$NUMBER" --repo "${{ github.repository }}" --json title,body --jq "\"@llroxy-bot 请执行以下工单，完成后开 PR 到 main，不要合并。\n\n# \" + .title + \"\n\n\" + .body" > /tmp/comment.md
          gh issue comment "$NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
